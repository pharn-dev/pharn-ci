# .github/workflows/pharn-ci.yml: pharn-ci on a Rust project.
# No coverage-file is set: pharn-ci finds lcov.info, which cargo-llvm-cov writes below.
# No threshold is set either, so diff coverage is reported but does not fail the step. The step still fails on:
#   - a secret committed in an agent config file (S01-S09), or an agent config file left unscanned for its size,
#     count or path;
#   - invisible Unicode, such as a zero-width or bidi control character, added to any file but a test file, a
#     fixture or test data (PI01);
#   - a dependency from outside the registry: a git, file or URL source, or a package index outside the allowed
#     registries (D05);
#   - a dependency change the lockfile does not record, or a locked version whose integrity hash changed (D04);
#   - a run error, such as an invalid input.
# Add `with: threshold: 80` for the diff-coverage gate: the step then also fails when diff coverage is below 80%
# or cannot be measured. An org policy, fetched with id-token: write below, can add more failures.
name: pharn-ci
on: pull_request

permissions:
  contents: read
  pull-requests: write
  id-token: write # pharn-ci fetches your org policy from pharn.dev and, with the default upload: auto, uploads the redacted report and run metadata there; remove it and pharn-ci makes no call to pharn.dev

# One run per PR at a time, so concurrent pushes do not race on the sticky comment. The github.ref
# fallback gives each merge-queue entry its own group, since merge_group events have no PR number.
concurrency:
  group: pharn-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pharn-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: rustup component add llvm-tools-preview
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-llvm-cov
      - run: cargo llvm-cov --lcov --output-path lcov.info
      - uses: pharn-dev/pharn-ci@bd7b36ea07588884418f5002ae74afc35135c400 # v0.11.0
        timeout-minutes: 5
