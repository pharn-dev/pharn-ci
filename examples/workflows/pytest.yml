# .github/workflows/pharn-ci.yml: pharn-ci on a pytest project.
# No coverage-file is set: pharn-ci finds coverage.xml, which pytest-cov writes below. No threshold is
# set either, so the step reports and never fails; add `with: threshold: 80` to gate on diff coverage.
name: pharn-ci
on: pull_request

permissions:
  contents: read
  pull-requests: write

# One run per PR at a time, so concurrent pushes do not race on the sticky comment. The github.ref
# fallback gives each merge-queue entry its own group, since merge_group events have no PR number.
concurrency:
  group: pharn-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pharn-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install pytest pytest-cov
      - run: pytest --cov --cov-report=xml
      - uses: pharn-dev/pharn-ci@v0.4.0 # or, better, the tag's full commit SHA
        timeout-minutes: 5
