name: CI

# GitHub reports an Actions job under its `name:` (or its job id when it has none), and that string is
# what the `main` branch ruleset lists in `required_status_checks`. So the job ids below (`ci`) and the
# `name:` of `action-pins` are a CONTRACT with the ruleset, not decoration: renaming one makes a
# required check unreportable and blocks every PR until the ruleset is edited to match. Do not add a
# `strategy.matrix` to either job: GitHub would report it as `<name> (<value>)` and the required
# context would never arrive.
#
# Third-party actions are pinned to a commit SHA (enforced by the `Action pins` job and the repo's
# "require actions to be pinned" setting); the version goes in a trailing comment.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a PR cancels its older run; runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write # sticky PR comment from the dogfood step
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history so pharn-ci can diff locally
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - name: Test (with lcov coverage)
        run: pnpm test:coverage

      - run: pnpm build

      - name: Check packages/action/dist is up to date
        run: |
          if ! git diff --exit-code -- packages/action/dist || [ -n "$(git status --porcelain -- packages/action/dist)" ]; then
            echo "::error::packages/action/dist is stale. Run 'pnpm build' and commit the result."
            exit 1
          fi

      - name: Dogfood pharn-ci
        id: pharn
        uses: ./
        with:
          coverage-file: coverage/lcov.info
          threshold: 80

      - name: Show report
        if: always() && steps.pharn.outputs.report-path != ''
        run: cat "${{ steps.pharn.outputs.report-path }}"

  action-pins:
    name: Action pins
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Check that every action is pinned to a commit SHA
        run: node scripts/check-action-pins.mjs
