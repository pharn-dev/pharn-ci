name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # sticky PR comment from the dogfood step
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so pharn-ci can diff locally

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - name: Test (with lcov coverage)
        run: pnpm test:coverage

      - run: pnpm build

      - name: Check packages/action/dist is up to date
        run: |
          if ! git diff --exit-code -- packages/action/dist || [ -n "$(git status --porcelain -- packages/action/dist)" ]; then
            echo "::error::packages/action/dist is stale. Run 'pnpm build' and commit the result."
            exit 1
          fi

      - name: Dogfood pharn-ci
        id: pharn
        uses: ./
        with:
          coverage-file: coverage/lcov.info
          threshold: 80

      - name: Show report
        if: always() && steps.pharn.outputs.report-path != ''
        run: cat "${{ steps.pharn.outputs.report-path }}"
