name: CI

# GitHub reports an Actions job under its `name:` (or its job id when it has none), and that string is
# what the `main` branch ruleset lists in `required_status_checks`. So the job ids below (`ci`) and the
# `name:` of `action-pins` are a CONTRACT with the ruleset, not decoration: renaming one makes a
# required check unreportable and blocks every PR until the ruleset is edited to match. Do not add a
# `strategy.matrix` to either job: GitHub would report it as `<name> (<value>)` and the required
# context would never arrive.
#
# Third-party actions are pinned to a commit SHA (enforced by the `Action pins` job and the repo's
# "require actions to be pinned" setting); the version goes in a trailing comment.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a PR cancels its older run; runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write # sticky PR comment from the dogfood step
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history so pharn-ci can diff locally
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - name: Test (with lcov coverage)
        run: pnpm test:coverage

      - run: pnpm build

      - name: Check packages/action/dist is up to date
        run: |
          if ! git diff --exit-code -- packages/action/dist || [ -n "$(git status --porcelain -- packages/action/dist)" ]; then
            echo "::error::packages/action/dist is stale. Run 'pnpm build' and commit the result."
            exit 1
          fi

      # Review of the dist diff is the backstop against a build dependency that tampers with the bundle
      # (docs/THREAT-MODEL.md, G1). Put the change in front of the reviewer: the dist files this PR
      # changes and the bundle's sha256 before and after. Informational only: never fails the job.
      - name: Summarize packages/action/dist change
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -uo pipefail
          bundle=packages/action/dist/index.js
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags --quiet origin "$BASE_SHA" || echo "::warning::could not fetch the PR base $BASE_SHA"
          fi
          # Three-dot needs a merge base; a shallow history may lack one, so fall back to base..HEAD.
          stat="$(git diff --stat "$BASE_SHA...HEAD" -- packages/action/dist 2>/dev/null \
            || git diff --stat "$BASE_SHA" HEAD -- packages/action/dist 2>/dev/null)" || stat="unavailable"
          if git cat-file -e "$BASE_SHA:$bundle" 2>/dev/null; then
            base_sum="$(git show "$BASE_SHA:$bundle" | sha256sum | cut -d' ' -f1)"
          else
            base_sum="(unavailable)"
          fi
          head_sum="$(sha256sum "$bundle" | cut -d' ' -f1)"
          {
            echo "### packages/action/dist in this PR"
            echo
            if [ "$stat" = "unavailable" ]; then
              echo "Could not diff against the PR base \`$BASE_SHA\`. Review the \`packages/action/dist\` diff in the PR."
            elif [ -z "$stat" ]; then
              echo "This PR does not change \`packages/action/dist\`."
            else
              echo "This PR changes the committed bundle that consumers run. Review this diff: it is the only human check on the shipped artifact."
              echo
              echo '```text'
              echo "$stat"
              echo '```'
            fi
            echo
            echo "| \`$bundle\` | sha256 |"
            echo "| --- | --- |"
            echo "| base (\`${BASE_SHA:0:12}\`) | \`$base_sum\` |"
            echo "| this PR (rebuilt and checked above) | \`$head_sum\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dogfood pharn-ci
        id: pharn
        uses: ./
        with:
          coverage-file: coverage/lcov.info
          threshold: 80

      - name: Show report
        if: always() && steps.pharn.outputs.report-path != ''
        run: cat "${{ steps.pharn.outputs.report-path }}"

  action-pins:
    name: Action pins
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Check that every action is pinned to a commit SHA
        run: node scripts/check-action-pins.mjs
