version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
    groups:
      # Bundled into packages/action/dist, so these PRs fail `ci` until dist is rebuilt on the
      # branch (CONTRIBUTING.md, "Dependabot PRs"). Grouped to keep that to one PR a week.
      actions-runtime:
        patterns:
          - '@actions/*'
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns:
          - '*'
