name: pharn-ci
description: Check whether AI coding agents can safely work in your repo — diff coverage gate and agent setup inventory.
author: pharn-dev
branding:
  icon: shield
  color: green

inputs:
  coverage-file:
    description: Path to the coverage report, relative to the workspace. Defaults to coverage.file in .pharn/ci.yml.
    required: false
  coverage-format:
    description: Coverage report format, "lcov", "cobertura" or "auto" (detect it from the start of the file). Defaults to coverage.format in .pharn/ci.yml, then auto.
    required: false
  threshold:
    description: Minimum diff coverage percent (0-100, inclusive). Defaults to coverage.threshold in .pharn/ci.yml; no gate if unset.
    required: false
  base-ref:
    description: Ref or SHA to diff against (merge-base with HEAD). Defaults to the pull request base; in a merge queue (merge_group), the queue base; on push, the previous commit. A base-ref found neither in the checkout nor through the GitHub API fails the step.
    required: false
  exclude:
    description: Glob patterns of changed files to leave out of diff coverage, separated by commas or newlines. Added to coverage.exclude in .pharn/ci.yml, never replacing it.
    required: false
  coverage-root:
    description: Directory, relative to the repository root, that relative coverage paths start from (for package-relative coverage in a monorepo). Defaults to coverage.root in .pharn/ci.yml, then the repository root.
    required: false
  require-agent-setup:
    description: Fail the check when the repo has no agent setup files (CLAUDE.md, AGENTS.md, .cursor/rules, ...). Defaults to setup.require in .pharn/ci.yml, then false.
    required: false
  comment:
    description: Post or update one sticky PR comment with the report.
    required: false
    default: "true"
  fail-on-threshold:
    description: Fail the step when the verdict is "fail".
    required: false
    default: "true"
  config:
    description: Path to the pharn-ci config file, relative to the workspace. Defaults to .pharn/ci.yml, which may be absent; a file named here that does not exist fails the step.
    required: false
  github-token:
    description: Token for the GitHub API, used only for the PR comment and the diff fallback. Needs contents read, plus pull-requests write only for the comment. May be empty with comment false and a local diff.
    required: false
    default: ${{ github.token }}

outputs:
  report-path:
    description: Path to report.json (Report v1, see schema/report.v1.json).
  verdict:
    description: pass, warn or fail.
  diff-coverage:
    description: Diff coverage percent, or empty when it could not be computed.

runs:
  using: node24
  main: packages/action/dist/index.js
