name: pharn-ci
description: Check whether AI coding agents can safely work in your repo — diff coverage, test integrity, agent setup and policy.
author: pharn-dev
branding:
  icon: shield
  color: green

inputs:
  coverage-file:
    description: Coverage report paths or globs (*, **, ?), one entry per line (commas are part of a path), relative to the workspace. All matched files are merged, with hit counts summed. Defaults to coverage.file in .pharn/ci.yml; when that is unset too, the report is auto-discovered at coverage/lcov.info, lcov.info, coverage.xml, coverage/cobertura-coverage.xml or **/coverage.cobertura.xml (several kinds found is an error).
    required: false
  coverage-format:
    description: Coverage report format, "lcov", "cobertura" or "auto" (detect it from the start of the file). Defaults to coverage.format in .pharn/ci.yml, then auto.
    required: false
  threshold:
    description: Minimum diff coverage percent (0-100, inclusive). Defaults to coverage.threshold in .pharn/ci.yml; when both are set, the larger applies (the config may raise this input, never lower it); no gate if neither is set.
    required: false
  base-ref:
    description: Ref or SHA to diff against (merge-base with HEAD). Defaults to the pull request base; in a merge queue (merge_group), the queue base; on push, the previous commit. A base-ref found neither in the checkout nor through the GitHub API fails the step.
    required: false
  pr-number:
    description: Number of the pull request to measure when the event carries no pull_request payload (a workflow_run or workflow_dispatch run). The PR, its diff and its file list are read from the GitHub API; no PR code is checked out, and the report is commented on this PR. Digits only, no leading zero. Not set on pull_request events.
    required: false
  head-sha:
    description: Commit SHA the pr-number run expects the PR head to be; the step fails when the PR head is another commit. Set it to the head SHA of the triggering event, the expression github.event.workflow_run.head_sha. Only valid together with pr-number.
    required: false
  exclude:
    description: Glob patterns of changed files to leave out of diff coverage, separated by commas or newlines. Added to coverage.exclude in .pharn/ci.yml, never replacing it.
    required: false
  coverage-root:
    description: Directory, relative to the repository root, that relative coverage paths start from (for package-relative coverage in a monorepo). Defaults to coverage.root in .pharn/ci.yml, then the repository root.
    required: false
  require-agent-setup:
    description: Fail the check when the repo has no agent setup files (CLAUDE.md, AGENTS.md, .cursor/rules, ...). Defaults to setup.require in .pharn/ci.yml, then false; false does not turn off a setup.require true.
    required: false
  expect-agent-setup:
    description: Agent tools (for example claude-code, cursor) the report names when no agent setup file configures them, separated by commas or newlines. Added to setup.expect in .pharn/ci.yml, never replacing it.
    required: false
  test-integrity:
    description: How strictly to treat weakened tests, "block", "warn" or "off". Defaults to warn. test_integrity.mode in .pharn/ci.yml can only make the check stricter than this input (or the default), never looser; a looser value is ignored and reported as TEST_INTEGRITY_MODE_IGNORED.
    required: false
  accept-label:
    description: Name of the pull request label a reviewer who is not the PR author applies to sign off test-integrity block findings, at most 50 characters. Only used on pull_request runs and pr-number runs with test-integrity block; the CLI and .pharn/ci.yml never set it. Defaults to pharn/accepted.
    required: false
    default: pharn/accepted
  policy:
    description: 'Where the org policy comes from: "auto" fetches it from the pharn.dev app when the job grants id-token: write (only the OIDC token and the repo name are sent; no policy or no token is silent), "never" uses none, "required" fails the check when no policy can be fetched, and "file:<path>" reads a policy document from the workspace (a path the pull request can change, so it can only tighten; nothing is fetched). A policy raises the thresholds and the test-integrity mode and replaces the exclusions and the coverage root; see the README, Org policy.'
    required: false
    default: auto
  app-url:
    description: Origin of the pharn.dev app to fetch the org policy from. https only, with no credentials, path, query or fragment; empty means https://pharn.dev. The OIDC audience stays pharn.dev whatever this is.
    required: false
    default: https://pharn.dev
  upload:
    description: 'Whether to upload the run (report.json and meta.json, redacted, never file contents, diffs, coverage files or logs) to pharn.dev: "auto" uploads when the job grants id-token: write and the org installed the Pharn GitHub App, and "never" turns the upload off. An upload that fails never fails the check. Not read from .pharn/ci.yml, so a pull request cannot change it; see the README, Upload to pharn.dev.'
    required: false
    default: auto
  junit-paths:
    description: "JUnit XML files the test step wrote, as paths or globs (*, **, ?) relative to the workspace, separated by newlines or commas; a path outside the workspace is refused. At most 50 files, 25 MiB and 20,000 test cases are read. The results fill the Flaky section of the comment and report.json's flaky object, the org's quarantine list from pharn.dev is applied to them, and with an upload a normalised copy (test names, status, time and failure messages redacted and cut to 2 KB, never system-out or system-err) goes with it. Test results never change the verdict. Not read from .pharn/ci.yml. Empty means no JUnit."
    required: false
  comment:
    description: Post or update one sticky PR comment with the report.
    required: false
    default: "true"
  fail-on-verdict:
    description: Fail the step when the verdict is "fail", whatever made it fail - diff coverage, a test-integrity block or an org policy violation or error, a required policy included. With false the step reports and never gates. Defaults to true.
    required: false
  fail-on-threshold:
    description: Deprecated old name of fail-on-verdict, still read (with a warning) when fail-on-verdict is not set.
    required: false
  config:
    description: Path to the pharn-ci config file, relative to the workspace. Defaults to .pharn/ci.yml, which may be absent; a file named here that does not exist fails the step.
    required: false
  github-token:
    description: Token for the GitHub API, used for the PR comment, the diff fallback and, in pr-number mode, always to read the pull request, its diff and its file tree. Needs contents read, plus pull-requests read in pr-number mode and pull-requests write for the comment. With test-integrity block it also reads the pull request and its issue events (GET /repos/{owner}/{repo}/issues/{issue_number}/events) for the accept label, which needs pull-requests read or issues read. On every pull_request run it lists the pull request's commits for agent-PR detection (pull-requests read); an empty or under-scoped token makes that detection fail closed, so under an org policy every pull request counts as an agent PR. May be empty with comment false and a local diff, outside pr-number mode.
    required: false
    default: ${{ github.token }}

outputs:
  report-path:
    description: Path to report.json (Report v2, see schema/report.v2.json).
  verdict:
    description: pass, warn or fail.
  diff-coverage:
    description: Diff coverage percent, or empty when it could not be computed.
  run-url:
    description: Page of the uploaded run on pharn.dev; set only when the run was uploaded.

# Requirements: Node 24 (the runner's), git, and for pull requests that modify Python test files a python3 (or python)
# of 3.8 or newer on PATH; without it TI02 and TI05 do not run for those files (README, Python test files).
runs:
  using: node24
  main: packages/action/dist/index.js
